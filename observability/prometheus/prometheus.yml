global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: openbook
    metrics_path: /metrics
    static_configs:
      - targets: [app:38080]

  - job_name: feishu-alert-bridge
    metrics_path: /healthz
    static_configs:
      - targets: [feishu-alert-bridge:8080]
