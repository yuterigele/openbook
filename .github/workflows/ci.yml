name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file .env.example -f docker-compose.yml config -q
      - name: Validate development Compose
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev-ports.yml config -q
      - name: Build deployable images
        run: docker compose --env-file .env.example -f docker-compose.yml build app feishu-alert-bridge
      - name: Start Compose smoke stack
        env:
          OPENBOOK_LLM_CHAIN: stub
          AGENT_REPLY_MODE: mock
        run: docker compose --env-file .env.example -f docker-compose.yml up -d --build mysql redis db-bootstrap app
      - name: Verify Compose smoke stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker-compose.yml ps
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:38080/ >/dev/null; then
              echo "OpenBook HTTP health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBook HTTP health check timed out" >&2
          docker compose --env-file .env.example -f docker-compose.yml ps >&2
          exit 1
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yml logs --no-color mysql redis db-bootstrap app
      - name: Stop Compose smoke stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml down -v

  dx-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Run Starter end-to-end smoke
        run: bash scripts/dx-smoke.sh
      - name: Upload Starter smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbook-dx-smoke
          path: artifacts/dx-smoke
          if-no-files-found: warn
