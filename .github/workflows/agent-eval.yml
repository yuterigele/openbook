name: Agent evaluation

on:
  pull_request:
    paths:
      - "cmd/agent-eval/**"
      - "docs/evals/**"
      - "evaluation/**"
      - "intent/**"
      - "tools/**"
      - "storage/**"
  push:
    branches: [main]
    paths:
      - "cmd/agent-eval/**"
      - "docs/evals/**"
      - "evaluation/**"
      - "intent/**"
      - "tools/**"
      - "storage/**"

jobs:
  keyword-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Verify evaluation package
        run: go test ./evaluation -count=1
      - name: Enforce keyword routing baseline
        run: go run ./cmd/agent-eval -min-accuracy 1 -min-critical-accuracy 1

  appointment-flow-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Verify deterministic appointment flows
        run: go test ./tools -run '^TestE2E_S[1-6]_' -count=1
